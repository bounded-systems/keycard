name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@00686548e81f3659ca273d185421b668c8d70f90
    with:
      security: true
      test: true
      runtime: none
      # elan first (toolchain pinned by lean-toolchain), then the proofs,
      # then the tool, then the TLC model check. Egress note: the installer
      # talks to elan.lean-lang.org and toolchain downloads come from
      # releases.lean-lang.org (plural — verified against a live build);
      # check.sh additionally fetches the pinned tla2tools release asset from
      # github.com and verifies its digest before running it.
      # A failing `lake build` IS the red check: theorems self-certify.
      # check.sh is a gate for the same reason, inverted: two of its three
      # configs are SUPPOSED to fail, so it asserts each outcome rather than
      # reporting it — a counterexample that stops reproducing has to go red,
      # not green. It needs java, which ubuntu-latest carries preinstalled.
      test-command: >-
        curl --proto '=https' --tlsv1.2 -sSf https://elan.lean-lang.org/elan-init.sh
        | sh -s -- -y --default-toolchain none
        && export PATH="$HOME/.elan/bin:$PATH"
        && lake build
        && cargo test --manifest-path tools/Cargo.toml --locked
        && cargo clippy --manifest-path tools/Cargo.toml --all-targets -- -D warnings
        && bash specs/tla/check.sh
