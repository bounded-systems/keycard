\* ISOLATING CONFIG 2 — the green-on-partial fault alone.
\*
\* AllowFallback = FALSE, so no substitution ever happens and every effect is
\* attributable to the named principal: NoUndernamedEffect HOLDS. The run
\* still reports success over whatever it reached, so a revocation landing
\* mid-run truncates the work and ships it green: NoSilentPartial BREAKS.
\*
\* This is the direction that answers "we removed the `||`, so we are done" —
\* also not. The credential can be revoked between selection and the last
\* target, and a run that greens on a subset is how an incomplete catalog
\* acquires full provenance. Lean counterpart: runnerBestEffort, which is
\* ActsAsNamed and violates Faithful.
SPECIFICATION Spec
CONSTANTS
  Repos          = {r1, r2}
  FallbackCovers = {r1}
  AllowFallback  = FALSE
  GreenOnPartial = TRUE
INVARIANT TypeOK
INVARIANT NoUndernamedEffect
INVARIANT NoSilentPartial
