\* ISOLATING CONFIG 1 — the substitution fault alone.
\*
\* GreenOnPartial = FALSE, so the run refuses to report success over an
\* incomplete result: NoSilentPartial HOLDS. AllowFallback is still TRUE, so
\* revocation still resolves to the weaker principal and effects still land
\* under an identity the policy never named: NoUndernamedEffect BREAKS.
\*
\* This is the direction that answers "we report failures honestly, so the
\* `||` is harmless" — it is not. Honest reporting does not make the effects
\* attributable to the right principal, and the revocation still bought
\* nothing. Lean counterpart: runnerSufficientFallback, which is Faithful and
\* violates ActsAsNamed and RevocationCloses.
SPECIFICATION Spec
CONSTANTS
  Repos          = {r1, r2}
  FallbackCovers = {r1}
  AllowFallback  = TRUE
  GreenOnPartial = FALSE
INVARIANT TypeOK
INVARIANT NoUndernamedEffect
INVARIANT NoSilentPartial
