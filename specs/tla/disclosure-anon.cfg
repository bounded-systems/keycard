\* THE INDEPENDENCE CONFIG. Atomic = TRUE, so the TOCTOU is closed: consent
\* is re-evaluated at commit and NoUnconsentedDisclosure holds. The anonymous
\* fallback is still live, so NoAnonUpload still breaks.
\*
\* This is the config that proves the two faults are independent. Fixing the
\* race does not close the fallback — and it is the fallback that produces the
\* upload nothing can retract.
SPECIFICATION Spec
CONSTANTS
  Sessions          = {s1, s2}
  Atomic            = TRUE
  AllowAnonFallback = TRUE
INVARIANT TypeOK
INVARIANT NoUnconsentedDisclosure
INVARIANT NoAnonUpload
