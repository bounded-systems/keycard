\* Safe mechanism — expect TLC to PASS every invariant and the liveness
\* property. Consent and credentials are re-evaluated at commit, and a
\* credential failure refuses instead of downgrading to anonymous
\* (`needs_auth` set, which is what passing --name buys).
SPECIFICATION Spec
CONSTANTS
  Sessions          = {s1, s2}
  Atomic            = TRUE
  AllowAnonFallback = FALSE
INVARIANT TypeOK
INVARIANT NoUnconsentedDisclosure
INVARIANT NoAnonUpload
PROPERTY Termination
